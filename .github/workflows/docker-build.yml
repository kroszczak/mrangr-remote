name: Build & Push Docker Image

# ─── Kiedy budujemy ───────────────────────────────────────────────
on:
  # Push do main → natychmiastowy build
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/docker-build.yml"

  # Co tydzień (poniedziałek 04:00 UTC) → aktualizacja zależności
  schedule:
    - cron: "0 4 * * 1"

  # Ręczny trigger z poziomu GitHub UI
  workflow_dispatch:

# ─── Zmienne ──────────────────────────────────────────────────────
env:
  IMAGE_NAME: kroszczark/mrangr-server-agent
  PLATFORMS: linux/amd64            # architektura PCSS Eagle/Altair

# ─── Zadania ──────────────────────────────────────────────────────
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout repozytorium
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Metadane obrazu (tagi, etykiety)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}
            type=sha,prefix=

      # 3. Buildx (wieloplatformowy builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Logowanie do Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build + push (gzip compression + no provenance for old Singularity on PCSS)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          outputs: type=image,push=true,compression=gzip,force-compression=true

      # 6. Podsumowanie (wypisz wersje R i terra w logu)
      - name: Print image info
        run: |
          echo "## Pushed tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
